<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porter POC</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #edf4ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.92), transparent 34%),
        linear-gradient(135deg, #edf4ff 0%, #f9fbff 50%, #e6effc 100%);
    }

    main {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    canvas {
      display: block;
      width: min(100vw - 36px, 1280px);
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 36px);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(30, 51, 92, 0.22);
      background: #f8fbff;
    }
  </style>
</head>
<body>
  <main>
    <canvas id="scene" width="1280" height="720" aria-label="Porter cart leading a shopper through an isometric grocery store"></canvas>
  </main>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    const storeImage = new Image();
    const shopperImage = new Image();

    const path = [
      { x: 210, y: 505, label: "Entering Store ->" },
      { x: 385, y: 425, label: "Finding Produce ->" },
      { x: 565, y: 505, label: "Navigating to Bakery ->" },
      { x: 760, y: 395, label: "Navigating to Dairy ->" },
      { x: 970, y: 465, label: "Heading to Checkout ->" },
      { x: 1095, y: 345, label: "Arrived at Checkout" }
    ];

    const segmentLengths = [];
    let totalLength = 0;

    for (let i = 0; i < path.length; i += 1) {
      const a = path[i];
      const b = path[(i + 1) % path.length];
      const length = Math.hypot(b.x - a.x, b.y - a.y);
      segmentLengths.push(length);
      totalLength += length;
    }

    const duration = 18500;
    const followerDistance = 95;
    let startTime = 0;
    let previousWaypoint = -1;
    let popup = { text: path[0].label, startedAt: 0 };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function easeInOut(value) {
      return value * value * (3 - 2 * value);
    }

    function pointAtDistance(distance) {
      const wrapped = ((distance % totalLength) + totalLength) % totalLength;
      let cursor = wrapped;

      for (let i = 0; i < segmentLengths.length; i += 1) {
        const length = segmentLengths[i];
        if (cursor <= length) {
          const a = path[i];
          const b = path[(i + 1) % path.length];
          const t = easeInOut(cursor / length);
          return {
            x: a.x + (b.x - a.x) * t,
            y: a.y + (b.y - a.y) * t,
            angle: Math.atan2(b.y - a.y, b.x - a.x),
            segment: i,
            progress: cursor / length
          };
        }
        cursor -= length;
      }

      return { ...path[0], angle: 0, segment: 0, progress: 0 };
    }

    function drawStore() {
      ctx.save();
      ctx.fillStyle = "#f8fbff";
      ctx.fillRect(0, 0, W, H);

      if (storeImage.complete && storeImage.naturalWidth > 0) {
        ctx.drawImage(storeImage, 0, 120, 3000, 2020, 38, 26, 1188, 655);
      }

      ctx.restore();
    }

    function drawTrail(distance) {
      ctx.save();
      ctx.globalAlpha = 0.42;
      ctx.fillStyle = "#2476ff";

      const visibleLength = 480;
      for (let d = 0; d < visibleLength; d += 22) {
        const p = pointAtDistance(distance - d);
        const radius = 4.5 * (1 - d / visibleLength) + 1.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y + 10, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawShopper(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.angle - 0.35) * 0.04);
      ctx.globalAlpha = 0.98;
      ctx.shadowColor = "rgba(38, 54, 87, 0.22)";
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 10;

      if (shopperImage.complete && shopperImage.naturalWidth > 0) {
        ctx.drawImage(shopperImage, 760, 80, 3000, 3000, -76, -146, 156, 164);
      }

      ctx.restore();
    }

    function drawPorterCart(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.angle - 0.45) * 0.08);

      ctx.shadowColor = "rgba(37, 52, 84, 0.25)";
      ctx.shadowBlur = 15;
      ctx.shadowOffsetY = 12;
      ctx.fillStyle = "rgba(39, 54, 84, 0.18)";
      ctx.beginPath();
      ctx.ellipse(0, 31, 56, 18, -0.06, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowColor = "transparent";

      ctx.lineWidth = 6;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.strokeStyle = "#798999";
      ctx.fillStyle = "rgba(244, 250, 255, 0.92)";
      ctx.beginPath();
      ctx.moveTo(-44, -2);
      ctx.lineTo(0, -24);
      ctx.lineTo(52, 2);
      ctx.lineTo(8, 32);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = "#93a4b4";
      ctx.lineWidth = 3;
      for (let i = 0; i < 4; i += 1) {
        const x = -29 + i * 22;
        ctx.beginPath();
        ctx.moveTo(x, 1);
        ctx.lineTo(x + 12, 24);
        ctx.stroke();
      }

      ctx.fillStyle = "#2f83ff";
      ctx.beginPath();
      ctx.moveTo(-20, -9);
      ctx.lineTo(3, -19);
      ctx.lineTo(24, -8);
      ctx.lineTo(1, 5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#9bd33a";
      ctx.beginPath();
      ctx.ellipse(17, 4, 13, 8, 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#5f6d78";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-34, -8);
      ctx.lineTo(-54, -24);
      ctx.stroke();

      ctx.fillStyle = "#2d333b";
      [[-31, 31], [15, 37], [48, 11]].forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    function drawCartLabel(p) {
      ctx.save();
      ctx.translate(p.x, p.y - 76);
      ctx.font = "700 17px Inter, system-ui, sans-serif";
      const textWidth = ctx.measureText("Porter").width;
      const boxWidth = textWidth + 42;

      ctx.fillStyle = "rgba(255, 255, 255, 0.94)";
      ctx.shadowColor = "rgba(34, 55, 91, 0.18)";
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 8;
      roundedRect(ctx, -boxWidth / 2, -18, boxWidth, 36, 18);
      ctx.fill();

      ctx.shadowColor = "transparent";
      ctx.fillStyle = "#2476ff";
      ctx.beginPath();
      ctx.arc(-boxWidth / 2 + 19, 0, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#26344a";
      ctx.fillText("Porter", -boxWidth / 2 + 32, 6);
      ctx.restore();
    }

    function drawPopup(now) {
      const age = now - popup.startedAt;
      const fadeIn = clamp(age / 350, 0, 1);
      const fadeOut = 1 - clamp((age - 1650) / 550, 0, 1);
      const alpha = fadeIn * fadeOut;

      if (alpha <= 0) return;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = "700 20px Inter, system-ui, sans-serif";
      const width = ctx.measureText(popup.text).width + 44;
      const x = W / 2 - width / 2;
      const y = 34 - (1 - fadeIn) * 8;

      ctx.fillStyle = "rgba(21, 38, 68, 0.88)";
      ctx.shadowColor = "rgba(29, 42, 70, 0.22)";
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 10;
      roundedRect(ctx, x, y, width, 46, 23);
      ctx.fill();

      ctx.shadowColor = "transparent";
      ctx.fillStyle = "#ffffff";
      ctx.fillText(popup.text, x + 22, y + 30);
      ctx.restore();
    }

    function roundedRect(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + r, y);
      context.arcTo(x + width, y, x + width, y + height, r);
      context.arcTo(x + width, y + height, x, y + height, r);
      context.arcTo(x, y + height, x, y, r);
      context.arcTo(x, y, x + width, y, r);
      context.closePath();
    }

    function drawWatermark() {
      ctx.save();
      ctx.font = "700 18px Inter, system-ui, sans-serif";
      ctx.fillStyle = "rgba(28, 43, 68, 0.72)";
      ctx.fillText("Porter by Offload Robotics", 34, H - 30);
      ctx.restore();
    }

    function render(now) {
      if (!startTime) {
        startTime = now;
        popup.startedAt = now;
      }

      const elapsed = (now - startTime) % duration;
      const distance = (elapsed / duration) * totalLength;
      const cart = pointAtDistance(distance);
      const shopper = pointAtDistance(distance - followerDistance);

      if (cart.segment !== previousWaypoint && cart.progress < 0.18) {
        previousWaypoint = cart.segment;
        popup = { text: path[cart.segment].label, startedAt: now };
      }

      drawStore();
      drawTrail(distance);

      if (shopper.y < cart.y) {
        drawShopper(shopper);
        drawPorterCart(cart);
      } else {
        drawPorterCart(cart);
        drawShopper(shopper);
      }

      drawCartLabel(cart);
      drawPopup(now);
      drawWatermark();

      requestAnimationFrame(render);
    }

    let loaded = 0;
    function imageReady() {
      loaded += 1;
      if (loaded === 2) requestAnimationFrame(render);
    }

    [storeImage, shopperImage].forEach((image) => {
      image.addEventListener("load", () => {
        imageReady();
      });
      image.addEventListener("error", () => {
        imageReady();
      });
    });

    storeImage.src = "AdobeStock_1891565163.png";
    shopperImage.src = "AdobeStock_1810976829.png";
  </script>
</body>
</html>
